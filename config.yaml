projeto:
  nome: "Análise de Microdados - ENADE Licenciaturas 2025"
  ano: 2025

# Configuração multi-edição. As chaves legadas abaixo permanecem enquanto o
# executor operacional de 2025 não for migrado nas fases seguintes.
edicoes:
  2017:
    nome: "Enade 2017"
    arquivos:
      zip_microdados: "dados_brutos/enade_2017/microdados_enade_2017_LGPD.zip"
      conceito_enade: "dados_brutos/enade_2017/resultados_conceito_enade_2017.xlsx"
      pasta_extraida: "dados_extraidos/enade_2017"
    leitura_txt:
      separador: ";"
      decimal: "."
      quotechar: '"'
      chunksize: 100000
      encodings: ["utf-8-sig", "utf-8", "cp1252", "latin1"]
  2025:
    nome: "Enade das Licenciaturas 2025"
